<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="yaanscoat - Frontend | UBG | Vibe Coder | Proxies | Bypassing Internet C*ncorship">
  <title>yaanscoat</title>
  <!-- the little picture in the browser tab is my github profile picture -->
  <link rel="icon" href="https://github.com/yaanscoat.png">
  <link rel="stylesheet" href="index.css">

  <!-- helpers for blog posts: markdown -> html, keeping it safe, and coloured code -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="index.js"></script>
</head>
<body>
  <a class="skip" href="#page">skip to content</a>

  <!-- top bar -->
  <header class="topbar">
    <nav class="topbar-inner" aria-label="Main">
      <a class="brand" href="#">
        <img src="https://github.com/yaanscoat.png" alt="" width="26" height="26">
        <span>yaanscoat</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="#" data-page="home">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z" />
          </svg>
          <span>home</span>
        </a>
        <a class="nav-link" href="#projects" data-page="projects">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" />
            <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" />
            <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" />
            <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" />
          </svg>
          <span>projects</span>
        </a>
        <a class="nav-link" href="#websites" data-page="websites">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <ellipse cx="12" cy="12" rx="4" ry="9" />
            <path d="M3 12h18" />
          </svg>
          <span>websites</span>
        </a>
        <a class="nav-link" href="#blog" data-page="blog">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 5.5l4 4M4 20l1-4.5L15.8 4.7a1.8 1.8 0 0 1 2.5 0l1 1a1.8 1.8 0 0 1 0 2.5L8.5 19z" />
          </svg>
          <span>blog</span>
        </a>
        <a class="nav-link" href="#music" data-page="music">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5.5l11-2V16" />
            <circle cx="6.5" cy="18" r="2.5" />
            <circle cx="17.5" cy="16" r="2.5" />
          </svg>
          <span>music</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- pages get put in here by index.js -->
  <main id="page" class="page" tabindex="-1"></main>

  <!-- 88x31 buttons, filled in by index.js -->
  <footer class="site-foot">
    <div class="buttons"></div>
    <p class="foot-note">
      made by yaanscoat.
      <a href="https://github.com/yaanscoat/yaanscoat-site" target="_blank" rel="noreferrer">source on github</a>.
      <a href="../index.html?stay">see this site at other times of year</a>
    </p>
  </footer>

  <!-- music player, stays at the bottom while you click around the site -->
  <div class="player" hidden>
    <img class="player-art" alt="">
    <div class="player-text">
      <span class="player-title"></span>
      <span class="player-artist"></span>
    </div>
    <div class="player-controls">
      <button class="player-btn" type="button" data-action="prev" aria-label="previous song">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
      </button>
      <button class="player-btn player-play" type="button" data-action="play" aria-label="play">
        <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15L20 12z" /></svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z" /></svg>
      </button>
      <button class="player-btn" type="button" data-action="next" aria-label="next song">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
      </button>
    </div>
    <div class="player-seek">
      <span class="player-time">0:00</span>
      <input class="player-bar" type="range" min="0" max="1000" value="0" aria-label="seek">
      <span class="player-length">0:00</span>
    </div>
    <div class="player-volume">
      <button class="player-btn player-mute" type="button" aria-label="mute">
        <svg class="icon icon-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" /><path class="vol-wave-1" d="M15.5 9.5a3.5 3.5 0 0 1 0 5" /><path class="vol-wave-2" d="M18 7a7 7 0 0 1 0 10" /></svg>
        <svg class="icon icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" /><path d="m16 9.5 5 5m0-5-5 5" /></svg>
      </button>
      <input class="player-bar player-vol" type="range" min="0" max="100" value="80" aria-label="volume">
    </div>
    <audio class="player-audio" preload="none"></audio>
  </div>
</body>
</html>
